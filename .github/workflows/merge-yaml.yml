name: Merge Static YAML Files

on:
  workflow_dispatch:   # run manually
  push:
    branches:
      - main

jobs:
  merge-yaml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Merge YAML files
        run: |
          cat << 'EOF' > merge_yaml.py
          import yaml

          with open("config/file1.yml") as f1, open("config/file2.yml") as f2:
              data1 = yaml.safe_load(f1) or {}
              data2 = yaml.safe_load(f2) or {}

          # Deep merge function
          def deep_merge(a, b):
              if isinstance(a, dict) and isinstance(b, dict):
                  merged = dict(a)
                  for k, v in b.items():
                      merged[k] = deep_merge(merged.get(k), v)
                  return merged
              elif isinstance(a, list) and isinstance(b, list):
                  return a + b
              else:
                  return b if b is not None else a

          merged = deep_merge(data1, data2)

          with open("merged.yml", "w") as out:
              yaml.dump(merged, out, sort_keys=False)
          EOF

          python merge_yaml.py

      - name: Upload merged YAML
        uses: actions/upload-artifact@v4
        with:
          name: merged-yaml
          path: merged.yml
