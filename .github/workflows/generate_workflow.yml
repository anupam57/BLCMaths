name: Generate Workflow

on:
  push:
    paths:
      - "clusters.yml"
      - "workflow_template.yml"
      - ".github/scripts/generate_workflow.py"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      workflows: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run generator
        run: python .github/scripts/generate_workflow.py
        
      - name: Commit final-workflow.yml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.yml
          git commit -m "Update final-workflow.yml [skip ci]" || echo "No changes to commit"
          git push
