name: Merge Configs & Generate Workflows

on:
  push:
    paths:
      - ".github/workflow-setup/push_template.yml"
      - ".github/scripts/generate_workflow.py"      
      - ".github/workflow-setup/default-config.yml"
      - "Module*/config.yml"
  workflow_dispatch:

jobs:
  merge-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allows commit and push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install --upgrade pip pyyaml

      - name: Merge YAML configs for all modules
        run: |
          cat << 'EOF' > merge_configs.py
          import os
          import yaml

          ROOT = os.getcwd()
          DEFAULT_CONFIG = os.path.join(ROOT, ".github/workflow-setup/default-config.yml")

          def deep_merge(a, b):
              if isinstance(a, dict) and isinstance(b, dict):
                  merged = dict(a)
                  for k, v in b.items():
                      merged[k] = deep_merge(merged.get(k), v)
                  return merged
              elif isinstance(a, list) and isinstance(b, list):
                  return b   # replace lists instead of merging
              else:
                  return b if b is not None else a

          with open(DEFAULT_CONFIG) as f:
              default_data = yaml.safe_load(f) or {}

          for folder in os.listdir(ROOT):
              module_path = os.path.join(ROOT, folder)
              config_file = os.path.join(module_path, "config.yml")

              if os.path.isdir(module_path) and folder.startswith("Module") and os.path.exists(config_file):
                  with open(config_file) as f:
                      module_data = yaml.safe_load(f) or {}

                  merged = deep_merge(default_data, module_data)
                  final_path = os.path.join(module_path, "final-config.yml")
                  with open(final_path, "w") as out:
                      yaml.dump(merged, out, sort_keys=False)
                  print(f"✅ Created {final_path}")
          EOF

          python merge_configs.py

      - name: Commit updated final-config.yml files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Module*/final-config.yml
          git commit -m "Update final-config.yml for all modules [skip ci]" || echo "No changes to commit"
          git push

      - name: Run workflow generator
        run: python .github/scripts/generate_workflow.py

      - name: Commit generated module workflows
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Module*/Module*-workflow.yml
          git commit -m "Update module workflows [skip ci]" || echo "No changes to commit"
          git push
