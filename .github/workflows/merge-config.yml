name: Merge YAML Into Branch

on:
  push:
    branches:
      - main   # or any branch you want this to run on
  workflow_dispatch: # allows manual run too

jobs:
  merge-yaml:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required to push changes back

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for committing

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Merge YAML files
        run: |
          cat << 'EOF' > merge_yaml.py
          import yaml

          with open("config/file1.yml") as f1, open("config/file2.yml") as f2:
              data1 = yaml.safe_load(f1) or {}
              data2 = yaml.safe_load(f2) or {}

          def deep_merge(a, b):
              if isinstance(a, dict) and isinstance(b, dict):
                  merged = dict(a)
                  for k, v in b.items():
                      merged[k] = deep_merge(merged.get(k), v)
                  return merged
              elif isinstance(a, list) and isinstance(b, list):
                  return a + b
              else:
                  return b if b is not None else a

          merged = deep_merge(data1, data2)

          with open("merged.yml", "w") as out:
              yaml.dump(merged, out, sort_keys=False)
          EOF

          python merge_yaml.py

      - name: Commit merged.yml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add merged.yml
          git commit -m "Update merged.yml [skip ci]" || echo "No changes to commit"
          git push