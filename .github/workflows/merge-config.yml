name: Merge YAML Into Branch

on:
  push:
    branches:
      - main   # adjust if needed
  workflow_dispatch: # allows manual run too

jobs:
  merge-yaml:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required to push changes back

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for committing

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Merge YAML configs for all modules
        run: |
          cat << 'EOF' > merge_configs.py
          import os
          import yaml

          ROOT = os.getcwd()
          DEFAULT_CONFIG = os.path.join(ROOT, "default-config.yml")

          def deep_merge(a, b):
              if isinstance(a, dict) and isinstance(b, dict):
                  merged = dict(a)
                  for k, v in b.items():
                      merged[k] = deep_merge(merged.get(k), v)
                  return merged
              elif isinstance(a, list) and isinstance(b, list):
                  return a + b
              else:
                  return b if b is not None else a
                  
          # Load default config
          with open(DEFAULT_CONFIG) as f:
              default_data = yaml.safe_load(f) or {}                  

          # Iterate over Module* folders
          for folder in os.listdir(ROOT):
              module_path = os.path.join(ROOT, folder)
              config_file = os.path.join(module_path, "config.yml")

              if os.path.isdir(module_path) and folder.startswith("Module") and os.path.exists(config_file):
                  with open(config_file) as f:
                      module_data = yaml.safe_load(f) or {}

                  merged = deep_merge(default_data, module_data)

                  final_path = os.path.join(module_path, "final-config.yml")
                  with open(final_path, "w") as out:
                      yaml.dump(merged, out, sort_keys=False)

                  print(f"✅ Created {final_path}")
          EOF

          python merge_configs.py

      - name: Commit updated final-config.yml files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Module*/final-config.yml
          git commit -m "Update final-config.yml for all modules [skip ci]" || echo "No changes to commit"
          git push
