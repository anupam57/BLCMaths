name: Merge YAML Files

on:
  workflow_dispatch:   # allows manual trigger
  push:
    branches:
      - main

jobs:
  merge-yaml:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. Install PyYAML
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      # 4. Merge YAML files
      - name: Merge YAML files
        run: |
          cat << 'EOF' > merge_yaml.py
          import yaml

          with open("file1.yml") as f1, open("file2.yml") as f2:
              data1 = yaml.safe_load(f1)
              data2 = yaml.safe_load(f2)

          # simple merge: file2 keys overwrite file1
          merged = {**data1, **data2}

          with open("merged.yml", "w") as out:
              yaml.dump(merged, out)
          EOF

          python merge_yaml.py

      # 5. Upload merged YAML as artifact
      - name: Upload merged YAML
        uses: actions/upload-artifact@v3
        with:
          name: merged-yaml
          path: merged.yml
