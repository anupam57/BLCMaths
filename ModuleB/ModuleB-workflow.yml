jobs:
  initialize:
    uses: ./.github/workflows/ci_cd_initialize.yml
    with:
      project-name: PROJECT_NAME

  promote-et:
    needs: [ initialize ]
    with:
      environment: et

  promote-qt:
    needs: [ initialize, promote-et ]
    with:
      environment: qt

  promote-de:
    needs: [ initialize, promote-qt ]
    with:
      environment: de

  promote-sb:
    needs: [ initialize, promote-de ]
    with:
      environment: sb

