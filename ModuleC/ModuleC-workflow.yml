jobs:
  initialize:
    uses: ./.github/workflows/ci_cd_initialize.yml
    with:
      project-name: PROJECT_NAME

  promote-sb:
    needs: [ initialize ]
    with:
      environment: sb

  promote-dt:
    needs: [ initialize, promote-sb ]
    with:
      environment: dt

  promote-et:
    needs: [ initialize, promote-dt ]
    with:
      environment: et

  promote-qt:
    needs: [ initialize, promote-et ]
    with:
      environment: qt

